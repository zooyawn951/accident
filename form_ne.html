<html lang="ne">
<head>
  <meta charset="UTF-8">
  <title>तपाईंको जानकारी</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
      <script>
        function saveInfo() {
          const name = document.getElementById('name').value;
          const visa = document.getElementById('visa').value;
          const region = document.getElementById('region').value;
    
          localStorage.setItem("name", name);
          localStorage.setItem("visa", visa);
          localStorage.setItem("region", region);
        }
    </script>
</head>
<body>
  <h2>कृपया आफ्नो जानकारी दिनुहोस्</h2>

  <form action = "previous_ne.html" method="GET">

    <label for="name">तपाईंको नाम के हो?</label>
    <input type="text" id="name" name="name" required>

    <label for="visa">तपाईं सँग कुन प्रकारको भिसा छ?</label>
    <select id="visa" name="visa" required>
      <option value="">कृपया छान्नुहोस्</option>
      <option value="미등록">दर्ता नभएको</option>
      <option value="E-9">E-9</option>
      <option value="E-7">E-7</option>
    </select>

    <label for="region">तपाईंको कार्यक्षेत्र कहाँ हो?</label>
    <select id="region" name="region" required>
      <option value="">कृपया छान्नुहोस्</option>
      <option value="서울특별시">सउल</option>
      <option value="부산광역시">बुसान</option>
      <option value="대구광역시">डेगु</option>
      <option value="인천광역시">इन्चन</option>
      <option value="광주광역시">ग्वाङ्जु</option>
      <option value="대전광역시">डेजोन</option>
      <option value="울산광역시">उल्सान</option>
      <option value="세종특별자치시">सेजोंग</option>
      <option value="경기도">ग्योङ्गीदो</option>
      <option value="강원도">काङ्वोन्दो</option>
      <option value="충청북도">चुङछोङबुक्दो</option>
      <option value="충청남도">चुङछोङनाम्दो</option>
      <option value="전라북도">जल्लाबुक्दो</option>
      <option value="전라남도">जल्लानाम्दो</option>
      <option value="경상북도">ग्योङ्साङबुक्दो</option>
      <option value="경상남도">ग्योङ्साङनाम्दो</option>
      <option value="제주도">जेजु</option>
    </select>

    <button type="submit">अर्को चरण</button>
  </form>
</body>
</html>
