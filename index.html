<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>언어 선택</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
    }

    h1 {
      margin-bottom: 40px;
    }

    .language-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .language-button {
      width: 200px;
      margin: 10px;
      padding: 15px;
      background-color: #f0f0f0;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .language-button:hover {
      background-color: #e0e0e0;
      border-color: #888;
    }
  </style>
</head>
<body>
  <h1>산재 신청 자가진단 웹사이트에 오신 걸 환영합니다</h1>
  <h2>언어를 선택해주세요</h2>

  <div class="language-container">
    <div class="language-button" onclick="goToForm('ko')">한국어 (Korean)</div>
    <div class="language-button" onclick="goToForm('en')">English (영어)</div>
    <div class="language-button" onclick="goToForm('ne')">नेपाली (네팔어)</div>
    <div class="language-button" onclick="goToForm('bd')">বাংলা (방글라데시어)</div>
    <div class="language-button" onclick="goToForm('mm')">မြန်မာစာ (미얀마어)</div>
    <div class="language-button" onclick="goToForm('km')">ភាសាខ្មែរ (캄보디아어)</div>
  </div>

  <script>
    function goToForm(langCode) {
      // 언어 코드에 따라 다른 파일로 이동
      location.href = `form_${langCode}.html`;}
  </script>

</body>
</html>
